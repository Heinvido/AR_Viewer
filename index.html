<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>View in AR</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/3.5.0/model-viewer.min.js"></script>
<style>
  html, body {
    margin: 0;
    height: 100%;
    background-color: #111;
    background-image: url('WoodyCape_Logo.png');
    background-repeat: no-repeat;
    background-position: center;
    background-size: min(60vw, 480px);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  }
  model-viewer {
    width: 100%;
    height: 100vh;
    --poster-color: transparent;
    background-color: transparent;
  }
  #ar-button {
    position: absolute;
    bottom: 84px; /* base 32px + ~1 button-height (52px) raised up */
    left: 50%;
    transform: translateX(-50%);
    min-height: 52px;
    display: flex;
    align-items: center;
    background: rgba(255, 255, 255, 0.18);
    background-image: linear-gradient(
      to bottom,
      rgba(255, 255, 255, 0.35),
      rgba(255, 255, 255, 0.08)
    );
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    color: #fff;
    border: 1px solid rgba(255, 255, 255, 0.4);
    border-radius: 999px;
    padding: 0 28px;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.2px;
    text-shadow: 0 1px 2px rgba(0, 0, 0, 0.25);
    box-shadow:
      0 8px 24px rgba(0, 0, 0, 0.35),
      inset 0 1px 1px rgba(255, 255, 255, 0.6),
      inset 0 -1px 1px rgba(0, 0, 0, 0.1);
  }
</style>
</head>
<body>

  <!--
    HOW THIS WORKS
    - ios-src   -> your USDZ file. Safari on iPhone/iPad uses this to launch AR Quick Look.
    - src       -> your GLB file. Chrome on Android uses this to launch Scene Viewer.
    - ar-modes  -> tells model-viewer which AR systems to try, in order.
    model-viewer automatically detects the platform and picks the right one.
    Replace the file paths below with your actual model files.
  -->
  <model-viewer
    id="ar-model"
    src="Dominus.glb"
    ios-src="Dominus.usdz"
    alt="Dominus 3D model"
    ar
    ar-modes="webxr scene-viewer quick-look"
    camera-controls
    auto-rotate
    shadow-intensity="1">
    <button id="ar-button" slot="ar-button">
      View in your space
    </button>
  </model-viewer>

<script>
  const mv = document.querySelector('#ar-model');
  mv.addEventListener('ar-status', (event) => {
    console.log('AR status:', event.detail.status);
  });
</script>

</body>
</html>
